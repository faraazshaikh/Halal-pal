name: 🕌 Halal debug APK

# Builds an installable debug APK of this fork and runs the halal checker tests.
# Download the APK from the run page: Actions > this run > Artifacts.
on:
  workflow_dispatch:
  push:
    branches:
      - halal-badge
      - halalpal-rebrand

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: ☕ Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - run: echo "FLUTTER_VERSION=$(cat flutter-version.txt)" >> $GITHUB_OUTPUT
        id: flutter-version

      - name: 🪺 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          cache-key: flutter-${{ hashFiles('flutter-version.txt')}}-${{ hashFiles('packages/smooth_app/pubspec.lock')}}

      - name: 🔧 Enable scanner and store dependencies
        run: |
          chmod +x ci/dependencies/scanner/enable_mlkit_dependency.sh ci/dependencies/app_store/enable_google_play_dependency.sh
          ci/dependencies/scanner/enable_mlkit_dependency.sh
          ci/dependencies/app_store/enable_google_play_dependency.sh

      - name: 📦 Get dependencies
        run: ci/pub_get.sh

      - name: 🧪 Halal checker tests
        working-directory: packages/smooth_app
        run: flutter test test/helpers/halal_checker_test.dart

      - name: 📱 Build debug APK
        working-directory: packages/smooth_app
        env:
          # sentry_flutter needs minSdk 26 (Android 8.0+); build.gradle.kts
          # reads this Gradle project property.
          ORG_GRADLE_PROJECT_minSdk: 26
        # Build number goes up with every CI run so a new APK always installs
        # over the previous one (pubspec starts at 1000, above the old 734).
        run: flutter build apk --debug --build-number=$((1000 + ${{ github.run_number }})) -t lib/entrypoints/android/main_google_play.dart --target-platform android-arm64

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: halal-pal-debug-apk
          path: packages/smooth_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: 🔑 Prepare release signing key (if secrets are set)
        id: sign
        env:
          KS_B64: ${{ secrets.SIGN_KEYSTORE_B64 || secrets.SIGN_KEYSTORE_864 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/halalpal-release.jks"
            echo "SIGN_STORE_PATH=$RUNNER_TEMP/halalpal-release.jks" >> "$GITHUB_ENV"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Build release APK (fast, personal sideload)
        id: release
        continue-on-error: true
        working-directory: packages/smooth_app
        env:
          ORG_GRADLE_PROJECT_minSdk: 26
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=$((1000 + ${{ github.run_number }})) -t lib/entrypoints/android/main_google_play.dart --target-platform android-arm64

      - name: ⬆️ Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: halal-pal-release-apk
          path: packages/smooth_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
