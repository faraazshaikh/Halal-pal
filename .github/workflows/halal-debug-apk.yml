name: 🕌 Halal debug APK

# Builds an installable debug APK of this fork and runs the halal checker tests.
# Download the APK from the run page: Actions > this run > Artifacts.
on:
  workflow_dispatch:
  push:
    branches:
      - halal-badge
      - halalpal-rebrand

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: ☕ Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - run: echo "FLUTTER_VERSION=$(cat flutter-version.txt)" >> $GITHUB_OUTPUT
        id: flutter-version

      - name: 🪺 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          cache-key: flutter-${{ hashFiles('flutter-version.txt')}}-${{ hashFiles('packages/smooth_app/pubspec.lock')}}

      - name: 🔧 Enable scanner and store dependencies
        run: |
          chmod +x ci/dependencies/scanner/enable_mlkit_dependency.sh ci/dependencies/app_store/enable_google_play_dependency.sh
          ci/dependencies/scanner/enable_mlkit_dependency.sh
          ci/dependencies/app_store/enable_google_play_dependency.sh

      - name: 📦 Get dependencies
        run: ci/pub_get.sh

      - name: 🧪 Halal checker tests
        working-directory: packages/smooth_app
        run: flutter test test/helpers/halal_checker_test.dart

      - name: 📱 Build debug APK
        working-directory: packages/smooth_app
        env:
          # sentry_flutter needs minSdk 26 (Android 8.0+); build.gradle.kts
          # reads this Gradle project property.
          ORG_GRADLE_PROJECT_minSdk: 26
        run: flutter build apk --debug -t lib/entrypoints/android/main_google_play.dart --target-platform android-arm64

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: halal-pal-debug-apk
          path: packages/smooth_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
