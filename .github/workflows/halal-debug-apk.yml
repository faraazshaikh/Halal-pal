name: 🕌 Halal debug APK

# Builds an installable debug APK of this fork and runs the halal checker tests.
# Download the APK from the run page: Actions > this run > Artifacts.
on:
  workflow_dispatch:
  push:
    branches:
      - halal-badge
      - halalpal-rebrand
    # The download page lives in site/ and needs no app build.
    paths-ignore:
      - 'site/**'

permissions:
  # contents: write lets the last step update the public 'latest' release.
  contents: write

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      release_built: ${{ steps.release.outcome }}
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: ☕ Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - run: echo "FLUTTER_VERSION=$(cat flutter-version.txt)" >> $GITHUB_OUTPUT
        id: flutter-version

      - name: 🪺 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          cache-key: flutter-${{ hashFiles('flutter-version.txt')}}-${{ hashFiles('packages/smooth_app/pubspec.lock')}}

      - name: 🔧 Enable scanner and store dependencies
        run: |
          chmod +x ci/dependencies/scanner/enable_mlkit_dependency.sh ci/dependencies/app_store/enable_google_play_dependency.sh
          ci/dependencies/scanner/enable_mlkit_dependency.sh
          ci/dependencies/app_store/enable_google_play_dependency.sh

      - name: 📦 Get dependencies
        run: ci/pub_get.sh

      - name: 🧪 Halal checker tests
        working-directory: packages/smooth_app
        run: flutter test test/helpers/halal_checker_test.dart test/helpers/update_checker_test.dart test/helpers/analytics_tracker_test.dart

      - name: 📱 Build debug APK
        working-directory: packages/smooth_app
        env:
          # sentry_flutter needs minSdk 26 (Android 8.0+); build.gradle.kts
          # reads this Gradle project property.
          ORG_GRADLE_PROJECT_minSdk: 26
        # Build number goes up with every CI run so a new APK always installs
        # over the previous one (pubspec starts at 1000, above the old 734).
        run: flutter build apk --debug --build-number=$((1000 + ${{ github.run_number }})) -t lib/entrypoints/android/main_google_play.dart --target-platform android-arm64

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: halal-pal-debug-apk
          path: packages/smooth_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: 🔑 Prepare release signing key (if secrets are set)
        id: sign
        env:
          KS_B64: ${{ secrets.SIGN_KEYSTORE_B64 || secrets.SIGN_KEYSTORE_864 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/halalpal-release.jks"
            echo "SIGN_STORE_PATH=$RUNNER_TEMP/halalpal-release.jks" >> "$GITHUB_ENV"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Build release APK (fast, personal sideload)
        id: release
        continue-on-error: true
        working-directory: packages/smooth_app
        env:
          ORG_GRADLE_PROJECT_minSdk: 26
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=$((1000 + ${{ github.run_number }})) -t lib/entrypoints/android/main_google_play.dart --target-platform android-arm64

      - name: ⬆️ Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: halal-pal-release-apk
          path: packages/smooth_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # Opens the real app on an Android emulator and visits every main screen.
  # A screen that crashes fails this job, and then nothing is published.
  emulator-smoke:
    name: Emulator smoke test (every screen opens)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: ☕ Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - run: echo "FLUTTER_VERSION=$(cat flutter-version.txt)" >> $GITHUB_OUTPUT
        id: flutter-version

      - name: 🪺 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          cache-key: flutter-${{ hashFiles('flutter-version.txt')}}-${{ hashFiles('packages/smooth_app/pubspec.lock')}}

      - name: 🔧 Enable scanner and store dependencies
        run: |
          chmod +x ci/dependencies/scanner/enable_mlkit_dependency.sh ci/dependencies/app_store/enable_google_play_dependency.sh
          ci/dependencies/scanner/enable_mlkit_dependency.sh
          ci/dependencies/app_store/enable_google_play_dependency.sh

      - name: 📦 Get dependencies
        run: ci/pub_get.sh

      - name: 🧩 Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🤖 Run the smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: false
          script: bash ci/emulator_smoke.sh

      - name: ⬆️ Upload evidence (screenshots, test log, app log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: warn

      # Keep the screenshots where they can be opened without a login: a
      # pre-release (never shown as the latest download) replaced on every run.
      - name: 🖼️ Attach evidence to the test-evidence pre-release
        if: always() && github.ref == 'refs/heads/halalpal-rebrand'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr emulator-evidence.zip evidence || true
          NOTES="Screenshots and logs from the emulator smoke test of run ${{ github.run_number }} (commit ${GITHUB_SHA::7}). Not an app download."
          if gh release view test-evidence >/dev/null 2>&1; then
            gh release edit test-evidence --prerelease --notes "$NOTES"
          else
            gh release create test-evidence --prerelease --title "Test evidence" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload test-evidence emulator-evidence.zip --clobber

  # Permanent download link, no login and no expiry:
  # https://github.com/faraazshaikh/halal-pal/releases/download/latest/HalalPal.apk
  # The download page links here, so visitors always get the newest build.
  # Runs only when the unit tests, the build AND the emulator smoke test passed.
  publish:
    name: Publish latest signed APK (only after all tests passed)
    needs: [build, emulator-smoke]
    if: needs.build.outputs.release_built == 'success' && needs.build.outputs.signed == 'yes' && github.ref == 'refs/heads/halalpal-rebrand'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: ⬇️ Download the tested release APK
        uses: actions/download-artifact@v4
        with:
          name: halal-pal-release-apk
          path: tested-apk

      - name: 📢 Publish latest signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tested-apk/app-release.apk HalalPal.apk
          VER=$(grep '^version:' packages/smooth_app/pubspec.yaml | sed 's/version: *//; s/+.*//')
          BUILD=$((1000 + ${{ github.run_number }}))
          TITLE="Halal Pal $VER (build $BUILD)"
          NOTES="Halal Pal $VER, build $BUILD. Built $(date -u +%Y-%m-%d). Passed the unit tests and the emulator smoke test (every main screen opens). A helper based on the ingredient list, not a halal certificate."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "$TITLE" --notes "$NOTES"
            gh release upload latest HalalPal.apk --clobber
          else
            gh release create latest HalalPal.apk --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
